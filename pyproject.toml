[project]
name = "urdu-mushaira"
version = "0.2.0"
description = "Multi-agent Urdu Mushaira powered by LangGraph"
requires-python = ">=3.11,<4.0"

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "langgraph>=0.1.0",
    "langchain>=0.1.0",
    "anthropic>=0.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langfuse>=3.0.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
python-version = "3.11"
